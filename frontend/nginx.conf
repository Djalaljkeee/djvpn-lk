# Внешний Caddy терминирует TLS и форвардит к нам по HTTP:80.
# Если просто писать `X-Forwarded-Proto $scheme;`, мы затрём правильное
# `https` от Caddy на `http` — backend ставит cookie без Secure, затем
# на следующем хопе scheme может оказаться https, и Chrome заводит
# ВТОРУЮ session_id-куку (отличается флагом Secure). Браузер шлёт обе,
# SHM берёт устаревшую → 401.
# Карта ниже: если апстрим уже выставил X-Forwarded-Proto — пробрасываем его,
# иначе подставляем $scheme. То же для X-Forwarded-For — сохраняем цепочку.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
