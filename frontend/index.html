<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#6D28D9" />
    <title>Личный кабинет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- async: telegram.org режется DPI в РФ и без async этот блокирующий
         скрипт в <head> вешает парсинг до сетевого таймаута — /src/main.tsx
         не исполняется, #root пустой → белый экран. С async интерфейс
         рендерится сразу, SDK догружается поверх (ожидание — в App.tsx). -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
