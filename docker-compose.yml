services:
  backend:
    image: ghcr.io/djalaljkeee/djvpn-lk-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - default
      - shm-net

  frontend:
    image: ghcr.io/djalaljkeee/djvpn-lk-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      - backend

networks:
  default:
    name: shm-cabinet
  shm-net:
    external: true
    name: ${SHM_NETWORK}
