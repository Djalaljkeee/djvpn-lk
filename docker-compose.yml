services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shmcabinet}
      POSTGRES_USER: ${POSTGRES_USER:-shmcabinet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shmcabinet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shmcabinet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт наружу не публикуем — БД доступна только внутри сети compose
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  backend:
    image: ghcr.io/djalaljkeee/djvpn-lk-backend:latest
    restart: unless-stopped
    # Биндим только на loopback: внешний мир ходит через frontend nginx, а
    # backend доверяет X-Forwarded-For от любого источника (см. ProxyHeaders-
    # Middleware в backend/main.py). Если порт открыть наружу — любой клиент
    # сможет подделать X-Forwarded-For и обойти rate-limit. С хоста для отладки
    # доступно через 127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      # DATABASE_URL собирается из POSTGRES_* — один источник правды для
      # креденшалов. `environment:` в compose имеет приоритет над `env_file:`,
      # поэтому DATABASE_URL из .env будет проигнорирован. Хотите внешний
      # postgres — правьте эту строку / убирайте переменную.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-shmcabinet}:${POSTGRES_PASSWORD:-shmcabinet}@postgres:5432/${POSTGRES_DB:-shmcabinet}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - shm-net

  frontend:
    image: ghcr.io/djalaljkeee/djvpn-lk-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      - backend

networks:
  default:
    name: shm-cabinet
  shm-net:
    external: true
    name: ${SHM_NETWORK}

volumes:
  postgres_data:
